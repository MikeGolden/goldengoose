# End-to-end run against the real production image:
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from e2e
services:
  site:
    build:
      context: .
      target: runtime
    environment:
      SITE_ADDRESS: ":80"

  e2e:
    # the official Playwright image ships Node and the matching browsers, not bun,
    # so this one container installs with npm — no package-lock.json in the repo
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    depends_on:
      site:
        condition: service_started
    working_dir: /work
    environment:
      BASE_URL: http://site
      CI: "1"
    volumes:
      - .:/work
    command: >
      sh -c "npm install --no-audit --no-fund && npx playwright test"
